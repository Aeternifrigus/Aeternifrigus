name: Generate Steak Profile Stats

on:
  schedule:
    - cron: '0 0 * * *' # Updates automatically every night at midnight
  workflow_dispatch: # Allows you to run it manually right away

permissions:
  contents: write # Allows the action to save stats.svg and languages.svg into your repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 1. Generates the Clean Commit Stats Card on the Left
      - name: Generate Overview Stats Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATISTICS_TOKEN }}
          filename: stats.svg
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          # "activity" isolates the metrics strictly to commits and basic contributions
          base: activity 
          config_timezone: UTC
          config_padding: 0, 8
          
          # Injecting Steak colors safely via custom CSS variable overrides
          extras_css: |
            :root {
              --color-text-primary: #f0e6e6 !important;
              --color-text-secondary: #a59393 !important;
              --color-stroke: #e0534b !important;
              --color-icon: #fe5f55 !important;
            }
            text, svg { fill: #f0e6e6 !important; }
            rect.bg { fill: #151010 !important; stroke: #e0534b !important; stroke-opacity: 0.3 !important; }

      # 2. Generates the Top Languages Card on the Right (Includes Private Repos)
      - name: Generate Top Languages Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATISTICS_TOKEN }}
          filename: languages.svg
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          base: "" # Keeps the language card focused entirely on code data
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 4
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes # Digs into private commit metadata history
          
          # Injecting Steak colors safely via custom CSS variable overrides
          extras_css: |
            :root {
              --color-text-primary: #f0e6e6 !important;
              --color-text-secondary: #a59393 !important;
              --color-stroke: #e0534b !important;
            }
            text, svg { fill: #f0e6e6 !important; }
            rect.bg { fill: #151010 !important; stroke: #e0534b !important; stroke-opacity: 0.3 !important; }
