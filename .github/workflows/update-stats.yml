name: Generate Steak Profile Stats

on:
  schedule:
    - cron: '0 0 * * *' # Updates automatically every night at midnight
  workflow_dispatch: # Allows you to run it manually right away

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 1. Generates the Overview Stats Card on the Left
      - name: Generate Overview Stats Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATISTICS_TOKEN }}
          filename: stats.svg
          base: header, activity, community, repositories
          config_timezone: UTC
          config_padding: 0, 8
          
          # Colors matching your Steak Theme
          palette: custom
          color_primary: "#fe5f55"    # Juicy Steak Red
          color_text: "#f0e6e6"       # Bone White text
          color_background: "#151010" # Charred Dark Base

      # 2. Generates the Top Languages Card on the Right (Includes Private Repos)
      - name: Generate Top Languages Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATISTICS_TOKEN }}
          filename: languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 4
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes # Digs into private commit metadata history
          
          # Identical color palette and dimensions configuration
          palette: custom
          color_primary: "#fe5f55"
          color_text: "#f0e6e6"
          color_background: "#151010"
