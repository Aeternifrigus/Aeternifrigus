<svg xmlns="http://w3.org" width="495" height="195" viewBox="0 0 495 195" fill="none">
    <style>
        .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #fe5f55; }
        .stat { font: 400 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #f0e6e6; }
        .bold { font-weight: 700; fill: #ff8a82; }
        .rank-text { font: 700 32px 'Segoe UI', Ubuntu, Sans-Serif; fill: #fe5f55; text-anchor: middle; dominant-baseline: central; }
        .rank-circle { stroke: #fe5f55; stroke-width: 6; fill: none; }
    </style>
    <!-- Background & Border -->
    <rect x="0.5" y="0.5" width="494" height="194" rx="4.5" fill="#151010" stroke="#e0534b" stroke-opacity="0.3"/>
    
    <!-- Title -->
    <g transform="translate(25, 35)">
        <text class="header" x="0" y="0">Aeternifrigus's GitHub Stats</text>
    </g>

    <!-- Stats Text Metrics -->
    <g transform="translate(25, 70)">
        <g transform="translate(0, 0)">
            <text class="stat">Total Stars: <tspan class="bold">12</tspan></text>
        </g>
        <g transform="translate(0, 25)">
            <text class="stat">Total Commits: <tspan class="bold">143</tspan></text>
        </g> 
        <g transform="translate(0, 50)">
            <text class="stat">PRs Merged: <tspan class="bold">8</tspan></text>
        </g> 
        <g transform="translate(0, 75)">
            <text class="stat">Total Issues: <tspan class="bold">4</tspan></text>
        </g>
    </g>

    <!-- Rank Indicator Graphic -->
    <g transform="translate(395, 115)">
        <circle class="rank-circle" r="40" />
        <text class="rank-text">C+</text>
    </g>
</svg>
